{{- if .Values.secret.create }}
{{- $data := .Values.secret.data -}}
{{- $required := list "SERVICE_TOKEN" "CREDENTIAL_ENCRYPTION_KEY" "DATABASE_DSN" "DATABASE_DRIVER" "REDIS_URL" "S3_ENDPOINT" "S3_PUBLIC_ENDPOINT" "S3_SANDBOX_ENDPOINT" "S3_REGION" "S3_BUCKET" "S3_ACCESS_KEY_ID" "S3_SECRET_ACCESS_KEY" "S3_USE_SSL" "S3_PRESIGN_TTL" "CONTENT_ENCRYPTION_KEY" "FINGERPRINT_HMAC_KEY" "TOKEN_SIGNING_SECRET" -}}
{{- range $key := $required }}{{ $_ := required (printf "secret.data.%s is required when secret.create=true" $key) (get $data $key) }}{{ end }}
{{- if .Values.router.enabled }}{{- $_ := required "secret.data.SANDBOX_ROUTER_SCOPED_TOKEN_SECRET is required when router.enabled=true and secret.create=true" (get $data "SANDBOX_ROUTER_SCOPED_TOKEN_SECRET") }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "secret.name is required" .Values.secret.name }}
type: Opaque
stringData:
  {{- range $key := $required }}
  {{ $key }}: {{ get $data $key | quote }}
{{- end }}
{{- if .Values.router.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-router-auth" .Release.Name) .Values.router.auth.secretName }}
type: Opaque
stringData:
  secret: {{ get $data "SANDBOX_ROUTER_SCOPED_TOKEN_SECRET" | quote }}
{{- if ne .Values.router.namespace .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-router-auth" .Release.Name) .Values.router.auth.secretName }}
  namespace: {{ .Values.router.namespace }}
type: Opaque
stringData:
  secret: {{ get $data "SANDBOX_ROUTER_SCOPED_TOKEN_SECRET" | quote }}
{{- end }}
{{- end }}
{{- end }}
