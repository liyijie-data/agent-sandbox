# values-prod.yaml — 生产部署配置模板
# secret.create=false：密钥由集群外部 Secret（name: agent-platform-production-env）提供，
# 故 data 无需在 values 填写；其余 CHANGE_ME 与空 CIDR 均为 [必填]，按生产环境填写。
# 字段说明见同目录 CONFIGURATION.md。

# 镜像拉取 Secret 名称（按生产集群实际创建）。
imagePullSecrets:
  - name: agent-platform-registry

secret:
  create: false
  name: agent-platform-production-env
  data:
    SERVICE_TOKEN: ""
    CREDENTIAL_ENCRYPTION_KEY: ""
    DATABASE_DSN: ""
    DATABASE_DRIVER: "postgres"
    REDIS_URL: ""
    S3_ENDPOINT: ""
    S3_PUBLIC_ENDPOINT: ""
    S3_SANDBOX_ENDPOINT: ""
    S3_REGION: ""
    S3_BUCKET: ""
    S3_ACCESS_KEY_ID: ""
    S3_SECRET_ACCESS_KEY: ""
    S3_USE_SSL: "false"
    S3_PRESIGN_TTL: 15m
    SANDBOX_ROUTER_SCOPED_TOKEN_SECRET: ""

server:
  # [必填] 生产控制面镜像。
  image: {repository: registry.example.com/agent-platform/control-plane, tag: "CHANGE_ME", digest: "", pullPolicy: IfNotPresent}
  replicas: 1
  service:
    type: ClusterIP
    port: 8080
    consolePort: 8090
  env:
    APP_ENV: production
    ALLOW_INSECURE_AUTH: "false"
    TZ: Asia/Shanghai
    # [必填] 允许的模型上游白名单（逗号分隔，按生产实际填；留默认则用代码默认）。
    MODEL_ALLOWED_UPSTREAM: https://model-upstream.example.com/v1
    MODEL_MAX_REQUESTS: "100"
    MODEL_TOKEN_TTL: 35m
    ARTIFACT_TTL: 3h
    ARTIFACT_CLEANUP_INTERVAL: 1m
    FILE_TTL: 24h
    FILE_CLEANUP_INTERVAL: 1m
  resources: {}

worker:
  # [必填] 生产 worker 镜像（与控制面一致）。
  image: {repository: registry.example.com/agent-platform/control-plane, tag: "CHANGE_ME", digest: "", pullPolicy: IfNotPresent}
  replicas: 1
  sandboxAPIURL: https://sandbox-router.example.invalid
  env:
    APP_ENV: production
    ALLOW_INSECURE_AUTH: "false"
    TZ: Asia/Shanghai
    WORKER_POLL_INTERVAL: 1s
    WORKER_CONCURRENCY: "4"
    WORKER_LEASE_TTL: 60s
    WORKER_HEARTBEAT_INTERVAL: 20s
    WORKER_MAX_ATTEMPTS: "3"
    SANDBOX_EXECUTION_TIMEOUT: 30m
    SANDBOX_REQUEST_TIMEOUT: 30m
  warmPool: ""
  resources: {}

router:
  enabled: false
  namespace: agent-sandbox
  auth:
    secretName: ""
  image: {repository: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandbox-router-go, tag: latest-main, pullPolicy: IfNotPresent}
  replicas: 1
  env:
    PROXY_TIMEOUT_SECONDS: "1800"
    WEBSOCKET_IDLE_TIMEOUT_SECONDS: "3600"
    WEBSOCKET_MAX_LIFETIME_SECONDS: "86400"
    WEBSOCKET_MAX_MESSAGE_BYTES: "16777216"
  resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1000m", memory: 1Gi}}

sandbox:
  # [必填] 生产沙箱运行时镜像。
  image: {repository: registry.example.com/agent-platform/sandbox-runtime, tag: "CHANGE_ME", pullPolicy: IfNotPresent}
  resources:
    requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi}
    limits: {cpu: "2", memory: 4Gi}
  hostAliases: []

warmPool:
  replicas: 0
  budget: 4
  maxPerImage: 2
  defaultPool: 0

# [必填] 平台网络基线按生产集群实际网段填写；留空表示不启用对应策略。
platformNetwork:
  controlPlaneServiceCIDR: ""
  kubeDNSServiceCIDR: ""
  podCIDRs: ""
  serviceCIDRs: ""
  nodeCIDRs: ""
  protectedCIDRs: ""
  businessPrivateCIDRs: ""
  reservedHostnames: ""
  ipv6Enabled: false
  allowDNSDependencies: false
  registryEndpoint: ""
  objectStorageCIDR: ""
  objectStoragePort: 9000
